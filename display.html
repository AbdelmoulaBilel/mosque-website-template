<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prayer times display</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Mulish:wght@400;600;700;800&family=Scheherazade+New:wght@700&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/display.css">
</head>
<body>
  <!--
    Mosque TV / screen mode. Open this page full screen (F11) on the prayer-hall screen.
    Language: display.html?lang=ar  (en | fr | ar)
    Everything comes from js/config.js — the same file as the website.
  -->
  <main class="board">
    <header class="top">
      <div class="brand"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="currentColor" d="M24 3.5a5.2 5.2 0 1 0 3.9 8.6 4.2 4.2 0 1 1-3.9-8.6Z"/><path fill="currentColor" d="M24 14c-1.2 3.4-5 5.6-8.6 7.8C11.9 24 9 26.6 9 31v13h30V31c0-4.4-2.9-7-6.4-9.2C29 19.6 25.2 17.4 24 14Zm-4 30v-8a4 4 0 0 1 8 0v8h-8Z"/><path fill="currentColor" d="M3 44V27.5l1.5-2 1.5 2V44H3Zm39 0V27.5l1.5-2 1.5 2V44h-3Z"/></svg><span id="name"></span></div>
      <div class="dates"><span id="greg"></span><span id="hijri"></span></div>
    </header>

    <section class="center">
      <div class="clock" id="clock">--:--</div>
      <div class="status">
        <p class="status__label" id="statusLabel"></p>
        <p class="status__name" id="statusName"></p>
        <p class="status__cd" id="statusCd">--:--:--</p>
      </div>
    </section>

    <ol class="row" id="row"></ol>

    <footer class="bottom">
      <p class="ticker" id="ticker"></p>
      <p class="jumuah" id="jumuah"></p>
    </footer>
  </main>
  <button class="fs" id="fs" type="button" aria-label="Full screen">⛶</button>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/praytimes.js"></script>
  <script src="js/display.js"></script>
</body>
</html>
